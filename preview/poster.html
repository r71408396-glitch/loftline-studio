<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Poster capture</title>
<style>body{margin:0;background:#f8fafc}#stage{position:relative}</style></head>
<body><div id="stage"></div>
<script type="module">
// Renders the hero desk at 1600 x 1334 px and posts it to the local capture server.
import { DeskViewer } from '../theme/assets/desk-viewer.js';
const W = 1600, H = 1334, dpr = Math.min(window.devicePixelRatio, 2);
const stage = document.getElementById('stage');
stage.style.width = `${W / dpr}px`;
stage.style.height = `${H / dpr}px`;
const viewer = new DeskViewer(stage, { interactive: true });
viewer.set({ top: 'oak', frame: 'black', edge: 'rounded', width: 1.6, depth: 0.8, accessories: { monitor_arm: true, desk_pad: true } }, { instant: true });
viewer.resize();
const canvas = viewer.renderer.domElement;
window.captureInfo = [canvas.width, canvas.height];
const data = viewer.snapshot('image/webp', 0.86);
const res = await fetch('http://localhost:5179/save?name=desk-poster.webp', { method: 'POST', body: data });
window.captureResult = await res.text();
</script></body></html>
