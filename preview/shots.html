<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Product shots</title>
<style>body{margin:0;background:#f8fafc;font:14px system-ui}#stage{position:relative}#log{position:fixed;top:0;right:0;padding:8px;background:#fff}</style></head>
<body><div id="stage"></div><pre id="log"></pre>
<script type="module">
// Renders the product photos from the 3D model (1600 x 1600 px) and posts each
// to the local capture server, which saves them in data/images/.
import { DeskViewer } from '../theme/assets/desk-viewer.js';
const SIZE = 1600, dpr = Math.min(window.devicePixelRatio, 2);
const stage = document.getElementById('stage');
stage.style.width = stage.style.height = `${SIZE / dpr}px`;
const viewer = new DeskViewer(stage);
viewer.resize();

const base = { width: 1.6, depth: 0.8, height: 0.74, edge: 'rounded', top: 'oak', frame: 'black', accessories: {} };
const front = [0.62, 0.42, 1];
const shots = [
  // Desk tops: one full desk per material
  ...['oak', 'walnut', 'bamboo', 'white', 'linoleum'].map((top) => ({
    name: `top-${top}`, config: { top, frame: top === 'white' ? 'white' : 'black' }, focus: 'desk',
  })),
  { name: 'top-oak-edge', config: { top: 'oak' }, focus: 'top', direction: [1, 0.3, 0.45], margin: 1.2 },
  // Frames on their own, sitting and standing
  ...['black', 'white', 'graphite', 'aluminium'].map((frame) => ({
    name: `frame-${frame}`, config: { frame }, focus: 'frame', hide: ['top', 'keypad'],
  })),
  { name: 'frame-black-standing', config: { frame: 'black', height: 1.12 }, focus: 'frame', hide: ['top', 'keypad'] },
  // Accessories in place on an oak desk
  { name: 'monitor-arm', config: { accessories: { monitor_arm: true } }, focus: 'monitor_arm', direction: [0.95, 0.35, -0.55], margin: 0.75 },
  ...[['graphite', '#34373c'], ['stone', '#a39c91'], ['ink', '#252c42']].map(([name, padColor]) => ({
    name: `desk-pad-${name}`, config: { padColor, accessories: { desk_pad: true } }, focus: 'desk_pad', direction: [0.35, 1, 0.75], margin: 0.75,
  })),
  { name: 'cable-tray', config: { accessories: { cable_tray: true } }, focus: 'cable_tray', direction: [0.45, -0.3, -1], margin: 0.95 },
  { name: 'under-desk-drawer', config: { accessories: { drawer: true } }, focus: 'drawer', direction: [0.4, 0.08, 1], margin: 0.5 },
];

const log = document.getElementById('log');
window.results = [];
const only = new URLSearchParams(location.search).get('only');
for (const shot of shots.filter((s) => !only || s.name === only)) {
  viewer.set({ ...base, ...shot.config, accessories: { ...shot.config.accessories } }, { instant: true });
  const data = viewer.shoot({ focus: shot.focus, hide: shot.hide || [], direction: shot.direction || front, margin: shot.margin });
  const res = await fetch(`http://localhost:5179/save?dir=images&name=${shot.name}.webp`, { method: 'POST', body: data });
  const text = await res.text();
  window.results.push(text);
  log.textContent += text + '\n';
}
window.done = true;
</script></body></html>
