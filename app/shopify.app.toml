# Loftline Ops: the store's own app (admin app, Functions and extensions).
# client_id is filled in by `shopify app config link` once the app exists in the Partner Dashboard.
client_id = "9c4d18d45a795c4119f927681796c0c7"
name = "Loftline Ops"
application_url = "https://ops.loftline.studio"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products,write_products,write_cart_transforms,write_discounts,read_orders,write_orders,read_customers,write_inventory,read_locations,write_files,write_metaobject_definitions,write_metaobjects,write_online_store_pages,write_online_store_navigation,write_publications,write_purchase_options"

[auth]
redirect_urls = ["https://ops.loftline.studio/auth/callback"]

# Storefront delivery dates: /apps/loftline/* on the shop is forwarded to /proxy/* here, signed.
[app_proxy]
url = "https://ops.loftline.studio/proxy"
subpath = "loftline"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  # Handled by app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Order webhooks need protected customer data access (Partner Dashboard > API access).
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = ["orders/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = ["orders/updated"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = ["inventory_levels/update"]

# Re-send prices to the desk bundle Function when a variant price changes.
[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "variant-price-change"
  topic = "Product"
  actions = ["update"]
  triggers = ["product.variants.price"]
  uri = "/webhooks/products/update"
  query = """
  query variant_price_change($productId: ID!) {
    product(id: $productId) {
      id
      productType
    }
  }
  """

[pos]
embedded = false
