# "Track your build" on the thank-you page (available on all plans).
api_version = "2026-10"

[[extensions]]
name = "Track your build"
handle = "thank-you-build"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[extensions.settings]
  [[extensions.settings.fields]]
  key = "assembly_video_url"
  type = "single_line_text_field"
  name = "Assembly video link"
  description = "Shown under the build steps, e.g. a YouTube link"
