query CartInput {
  cart {
    lines {
      id
      quantity
      accessories: attribute(key: "_accessories") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            productType
          }
        }
      }
    }
  }
  discount {
    discountClasses
    configuration: metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
