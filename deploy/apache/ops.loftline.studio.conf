# Loftline Ops behind Apache: forwards ops.loftline.studio to the app container on 127.0.0.1:3100.
# Needs mod_proxy, mod_proxy_http and mod_headers. certbot --apache adds the HTTPS copy of this site.
<VirtualHost *:80>
    ServerName ops.loftline.studio

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/loftline-ops-error.log
    CustomLog ${APACHE_LOG_DIR}/loftline-ops-access.log combined
</VirtualHost>
